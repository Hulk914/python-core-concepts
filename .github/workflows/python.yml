name: Python examples and tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run behavior tests and lesson smoke tests
        run: python -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m compileall -q learn.py lessons projects tests
